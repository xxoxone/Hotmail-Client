<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Config</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>code, pre, textarea, input { font-family: 'JetBrains Mono', monospace; }</style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        {% if not authenticated %}
        <div class="space-y-4">
            <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Authentication Required</h2>
            {% if error %}
            <div class="p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-xl">Access Denied</div>
            {% endif %}
            <form method="POST" class="space-y-4">
                <input type="password" name="password" placeholder="Access Key" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-indigo-500" autofocus>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-3 rounded-xl transition">Authenticate</button>
            </form>
        </div>
        {% else %}
        <div class="space-y-4">
            <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider">X.com Cookie Engine</h2>
                <a href="/xadminx?logout=1" class="text-xs text-rose-400 hover:underline">Exit</a>
            </div>
            {% if message %}
            <div class="p-3 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs rounded-xl">{{ message }}</div>
            {% endif %}
            <form method="POST" class="space-y-4">
                <input type="hidden" name="action" value="update_cookie">
                <label class="block text-xs text-slate-400 uppercase tracking-wider">Cookie Data</label>
                <textarea name="cookie_content" rows="12" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-300 focus:outline-none focus:border-indigo-500 leading-relaxed font-mono whitespace-pre overflow-x-auto">{{ current_cookies }}</textarea>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-3 rounded-xl transition">Save</button>
            </form>
        </div>
        {% endif %}
    </div>
</body>
</html>
