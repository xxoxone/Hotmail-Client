{% extends "base.html" %}

{% block content %}
<div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200 dark:border-darkborder p-4 sm:p-6 space-y-4 transition-colors duration-200">
    <div>
        <div class="flex items-center justify-between mb-2">
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Profile URL</label>
            <button type="button" onclick="clearUIDInput()" class="text-xs font-medium bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/60 px-2.5 py-1 rounded-lg transition border border-red-100 dark:border-red-900/40 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                Clear
            </button>
        </div>
        <input type="text" id="fb-link" placeholder="URL" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-darkborder focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs sm:text-sm font-mono bg-slate-50 dark:bg-slate-900/60 text-slate-800 dark:text-slate-200">
    </div>
    <button onclick="getUID()" id="btn-fb-uid" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition text-xs sm:text-sm flex items-center justify-center gap-2">
        <span>Extract</span>
    </button>
    <div id="uid-res" class="hidden p-4 rounded-xl bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-darkborder flex justify-between items-center">
        <span id="uid-text" class="font-mono font-bold text-xs sm:text-sm text-indigo-700 dark:text-indigo-400 break-all pr-2"></span>
        <button onclick="copyToClipboard(document.getElementById('uid-text').innerText, 'Copied', 'UID copied')" class="shrink-0 text-xs bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg shadow-sm font-medium">Copy</button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function clearUIDInput() {
        document.getElementById('fb-link').value = '';
        document.getElementById('uid-res').classList.add('hidden');
    }

    async function getUID() {
        const link = document.getElementById('fb-link').value.trim();
        if(!link) return;
        const btn = document.getElementById('btn-fb-uid');
        const resBox = document.getElementById('uid-res');
        btn.disabled = true;
        btn.innerText = "Extracting...";
        resBox.classList.add('hidden');

        try {
            const res = await fetch('/api/extract-uid', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url: link })
            });
            const data = await res.json();
            if(data.uid) {
                document.getElementById('uid-text').innerText = data.uid;
                resBox.classList.remove('hidden');
            } else {
                showToast("Error", "An error occurred. Please try again.");
            }
        } catch(err) {
            showToast("Error", "An error occurred. Please try again.");
        } finally {
            btn.disabled = false;
            btn.innerText = "Extract";
        }
    }
</script>
{% endblock %}
