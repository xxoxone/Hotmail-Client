{% extends "base.html" %}

{% block content %}
<div class="bg-white dark:bg-darkcard rounded-2xl shadow-sm border border-slate-200 dark:border-darkborder p-4 sm:p-6 space-y-6 transition-colors duration-200">
    <div>
        <div class="flex items-center justify-between mb-2">
            <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Secret Key</label>
            <button type="button" onclick="clear2FAKey()" class="text-xs font-medium bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-900/60 px-2.5 py-1 rounded-lg transition border border-red-100 dark:border-red-900/40 flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                Clear
            </button>
        </div>
        <input type="text" id="twofa-key" oninput="saveAndGenerate2FA()" placeholder="Secret Key" class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-darkborder focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs sm:text-sm font-mono bg-slate-50 dark:bg-slate-900/60 text-slate-800 dark:text-slate-200 uppercase">
    </div>

    <div id="twofa-box" class="hidden bg-slate-50 dark:bg-slate-900/50 border border-slate-200 dark:border-darkborder rounded-2xl p-6 text-center space-y-3">
        <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">Verification Code</span>
        <div class="flex items-center justify-center gap-4">
            <span id="twofa-code" class="text-4xl sm:text-5xl font-extrabold font-mono text-indigo-600 dark:text-indigo-400 tracking-widest">------</span>
            <button onclick="copyToClipboard(document.getElementById('twofa-code').innerText, 'Copied', '2FA code copied')" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-medium shadow-sm transition">
                Copy
            </button>
        </div>
        <div class="flex items-center justify-center gap-2 text-xs font-mono text-slate-400 dark:text-slate-500">
            <span>Refreshes in:</span>
            <span id="twofa-timer" class="font-bold text-slate-700 dark:text-slate-300">30s</span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let refreshInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
        const savedKey = localStorage.getItem('microtools_2fa_key') || '';
        if (savedKey) {
            document.getElementById('twofa-key').value = savedKey;
            saveAndGenerate2FA();
        }
    });

    function clear2FAKey() {
        document.getElementById('twofa-key').value = '';
        localStorage.removeItem('microtools_2fa_key');
        document.getElementById('twofa-box').classList.add('hidden');
        if (refreshInterval) clearInterval(refreshInterval);
    }

    async function saveAndGenerate2FA() {
        const rawKey = document.getElementById('twofa-key').value.replace(/\s+/g, '').toUpperCase();
        if (!rawKey) {
            clear2FAKey();
            return;
        }

        localStorage.setItem('microtools_2fa_key', rawKey);
        fetch2FACode(rawKey);

        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(() => {
            const sec = 30 - (Math.floor(Date.now() / 1000) % 30);
            document.getElementById('twofa-timer').innerText = `${sec}s`;
            if (sec === 30 || sec === 0) {
                fetch2FACode(rawKey);
            }
        }, 1000);
    }

    async function fetch2FACode(key) {
        try {
            const res = await fetch('/api/get-2fa', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ key })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('twofa-code').innerText = data.code;
                document.getElementById('twofa-box').classList.remove('hidden');
            } else {
                document.getElementById('twofa-box').classList.add('hidden');
            }
        } catch(e) {}
    }
</script>
{% endblock %}
